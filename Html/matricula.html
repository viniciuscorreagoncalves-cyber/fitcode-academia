<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Matrícula - ArenaFit</title>
  </head>

  <body>
    <header>
      <h1>ArenaFit Academia</h1>
    </header>

    <nav>
      <a href="index.html">Início</a> |
      <a href="modalidades.html">Modalidades</a> |
      <a href="planos.html">Planos</a> |
      <a href="estrutura.html">Estrutura</a> |
      <a href="matricula.html">Matrícula</a>
    </nav>

    <main>
      <h2>Faça sua matrícula</h2>

      <p>
        Preencha o formulário abaixo para demonstrar interesse em fazer parte da
        ArenaFit.
      </p>

      <form>
        <fieldset>
          <legend>Dados Pessoais</legend>

          <label for="nome">Nome completo:</label>
          <br />

          <input type="text" id="nome" name="nome" required />

          <br /><br />

          <label for="email">E-mail:</label>
          <br />

          <input type="email" id="email" name="email" required />

          <br /><br />

          <label for="telefone">Telefone:</label>
          <br />

          <input type="tel" id="telefone" name="telefone" />

          <br /><br />

          <label for="nascimento">Data de nascimento:</label>
          <br />

          <input type="date" id="nascimento" name="nascimento" />
        </fieldset>

        <br />

        <fieldset>
          <legend>Plano e Modalidade</legend>

          <label for="plano">Escolha um plano:</label>

          <select id="plano" name="plano">
            <option value="" selected disabled>Selecione</option>
            <option value="mensal">Mensal</option>
            <option value="trimestral">Trimestral</option>
            <option value="anual">Anual</option>
          </select>

          <br /><br />

          <label for="modalidade">Modalidade principal:</label>

          <select id="modalidade" name="modalidade">
            <option value="" selected disabled>Selecione</option>
            <option value="musculacao">Musculação</option>
            <option value="funcional">Funcional</option>
            <option value="pilates">Pilates</option>
          </select>

          <br /><br />

          <p>Horário de preferência:</p>

          <input type="radio" id="manha" name="horario" value="manha" />

          <label for="manha">Manhã</label>

          <input type="radio" id="tarde" name="horario" value="tarde" />

          <label for="tarde">Tarde</label>

          <input type="radio" id="noite" name="horario" value="noite" />

          <label for="noite">Noite</label>
        </fieldset>

        <br />

        <fieldset>
          <legend>Observações</legend>

          <label for="mensagem"> Conte um pouco sobre seu objetivo: </label>

          <br />

          <textarea
            id="mensagem"
            name="mensagem"
            rows="5"
            cols="40"
            placeholder="Ex: Quero ganhar massa muscular..."
          ></textarea>
        </fieldset>

        <br />

        <input type="submit" value="Enviar matrícula" />
        <input type="reset" value="Limpar" />
      </form>
    </main>

    <footer>
      <p>ArenaFit Academia - 2026</p>
    </footer>
  </body>
</html>
